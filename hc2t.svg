<svg xmlns="http://w3.org" viewBox="0 0 400 250" width="100%" height="100%">
  <!-- Tela do Terminal -->
  <rect width="400" height="250" fill="#050a05" stroke="#00FF33" stroke-width="2" rx="6"/>
  
  <!-- Barra Superior -->
  <rect width="400" height="30" fill="#112211" rx="6"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="15" r="5" fill="#27c93f"/>

  <!-- Linhas Simulando o Código Hacker (Aceito pelo GitHub) -->
  <g stroke="#00FF33" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <!-- Linha do Prompt -->
    <path d="M20,60 L28,65 L20,70" stroke-width="4"/>
    <path d="M36,70 L55,70" stroke-width="4"/>
    <path d="M70,65 L180,65" opacity="0.5"/>
    
    <!-- Bloco de código processando -->
    <path d="M20,95 L120,95" />
    <path d="M20,115 L240,115" />
    <path d="M20,135 L190,135" />
    
    <!-- Alerta de Sucesso (Bypass/Access Granted) -->
    <path d="M20,170 L380,170" stroke="#ffffff" stroke-width="4"/>
    <path d="M20,190 L300,190" stroke="#33FF66" stroke-width="4"/>
    
    <!-- Novo Prompt ativo no final -->
    <path d="M20,225 L28,230 L20,235" stroke-width="4"/>
    <path d="M36,235 L48,235" stroke-width="4" stroke-shadow="0 0 5px #fff"/>
  </g>
</svg>