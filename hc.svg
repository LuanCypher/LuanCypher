<svg xmlns="http://w3.org" viewBox="0 0 400 250" width="400" height="250">
  <!-- Janela do Terminal -->
  <rect width="400" height="250" fill="#050a05" stroke="#00FF33" stroke-width="2" rx="5"/>
  
  <!-- Barra Superior da Janela -->
  <rect width="400" height="25" fill="#112211" rx="5"/>
  <circle cx="15" cy="12.5" r="4" fill="#ff5f56"/>
  <circle cx="30" cy="12.5" r="4" fill="#ffbd2e"/>
  <circle cx="45" cy="12.5" r="4" fill="#27c93f"/>
  <text x="200" y="17" fill="#00FF33" font-family="monospace" font-size="11" text-anchor="middle">bash - root@unknown</text>

  <!-- Conteúdo do Terminal -->
  <g font-family="monospace" font-size="12" fill="#00FF33" font-weight="bold">
    <text x="15" y="55">root@kali:~# ./bypass_firewall.sh</text>
    <text x="15" y="80" fill="#00AA22">[i] Connecting to target server...</text>
    <text x="15" y="100" fill="#00AA22">[i] Injecting payload into SQL database...</text>
    <text x="15" y="120" fill="#00AA22">[i] Cracking RSA 4096-bit key...</text>
    
    <!-- Texto piscante/alerta de Sucesso -->
    <g fill="#33FF66">
      <text x="15" y="155" font-size="14" fill="#ffffff" back>==&gt; ACCESS GRANTED &lt;==</text>
      <text x="15" y="180">[v] System compromised successfully.</text>
    </g>
    
    <!-- Prompt ativo -->
    <text x="15" y="215">root@kali:~# <tspan fill="#ffffff">_</tspan></text>
  </g>
</svg>